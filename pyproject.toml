[project]
name = "stlsplit"
version = "0.1.0"
description = "CLI-first mesh splitter for STL/OBJ/3MF with connector support."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "trimesh>=4.0",
  "pyyaml>=6.0",
  "streamlit>=1.30",
  "rtree>=1.0",
  "google-generativeai>=0.3.0",
  "matplotlib>=3.7",
  "pyvista>=0.43",
  "stpyvista>=0.0.1",
]

[project.optional-dependencies]
booleans = [
  "manifold3d>=2.3",
]

[project.scripts]
stlsplit = "stlsplit.cli:main"
stlsplit-gui = "stlsplit.gui_launcher:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
